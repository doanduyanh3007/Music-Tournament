server.port=${PORT:8080}

# ===========================================================
# DATABASE
# - Trên Render: set env var DATABASE_URL (jdbc:postgresql://...)
#                           DATABASE_DRIVER=org.postgresql.Driver
#                           H2_CONSOLE=false
# - Local: không set -> dùng H2 file fallback bên dưới
# ===========================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/musicdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Dialect: tự detect từ URL (bỏ driver-class-name để Spring Boot tự chọn đúng driver)
spring.jpa.database-platform=${JPA_DIALECT:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 Console: tắt trên production (set H2_CONSOLE=false trên Render)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

app.admin-token=${APP_ADMIN_TOKEN:admin-demo-2026}
server.error.include-message=always
