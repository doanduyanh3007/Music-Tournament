server.port=${PORT:8080}

# ===========================================================
# DATABASE
# - Trên Render: set env var DATABASE_URL (jdbc:postgresql://...)
#                           DATABASE_DRIVER=org.postgresql.Driver
#                           H2_CONSOLE=false
# - Local: không set -> dùng H2 file fallback bên dưới
# ===========================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/musicdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Dialect: tự detect từ URL (bỏ driver-class-name để Spring Boot tự chọn đúng driver)
spring.jpa.database-platform=${JPA_DIALECT:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 Console: tắt trên production (set H2_CONSOLE=false trên Render)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

app.admin-token=${APP_ADMIN_TOKEN:admin-demo-2026}
server.error.include-message=always

# Spotify API Configuration (Hỗ trợ phân trang không giới hạn bài hát cho playlist lớn)
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

# ===========================================================
# AI RESEARCH & LLM CONFIGURATION (Render Environment Variables)
# ===========================================================
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# ===========================================================
# AUDIO ANALYSIS & UPLOAD CONFIGURATION (Phase 4)
# ===========================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
audio.python-path=${PYTHON_BIN:python}
audio.upload-dir=${AUDIO_UPLOAD_DIR:uploads/audio}
